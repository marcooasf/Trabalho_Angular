<article class="flex h-full flex-col gap-3 rounded-xl border border-white/20 bg-abissal/40 p-5">
  <img [src]="imagemDe(instrumento())" [alt]="instrumento().nome" class="mx-auto h-56 object-contain" />
  <p class="text-xs uppercase tracking-wide text-apoio">
    {{ instrumento().tipo }} · {{ instrumento().profundidade }}m
  </p>
  <h3 class="text-xl font-semibold">{{ instrumento().nome }}</h3>
  <app-medidor-timbre [nivel]="instrumento().timbre" />
  <p class="text-2xl font-semibold">{{ instrumento().preco | currency: 'BRL' }}</p>

  <div class="mt-auto flex flex-wrap gap-3 pt-2">
    <a [routerLink]="['/instrumento', instrumento().id]"
       class="rounded-xl border border-destaque px-4 py-2 text-destaque">Ver detalhes</a>
    <button type="button" (click)="adicionar.emit(instrumento())"
            class="rounded-xl bg-destaque px-4 py-2 font-semibold text-abissal">Adicionar</button>
  </div>
</article>
